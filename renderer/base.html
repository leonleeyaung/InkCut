<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>InkCut</title>
<style>
  :root{--bg:#14171d;--panel:#1c212a;--line:#2a323e;--fg:#dfe6f2;--dim:#8b93a1;--accent:#4ea1ff;--danger:#ff5b6e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Microsoft YaHei";overflow:hidden;user-select:none}
  button{font:inherit;color:var(--fg);background:#2b323d;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
  button:hover{background:#37404e}
  button.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  input[type=number],input[type=text],input[type=search]{font:inherit;color:var(--fg);background:#2f3642;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
  #top{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tag{color:var(--dim);font-size:12px}
  #pname{color:var(--fg);font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #main{display:flex;height:calc(100vh - 280px);min-height:220px}
  #vlist{width:236px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  #vsearch{padding:6px 8px}
  #vsearch input{width:100%}
  #vhead{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;color:var(--dim)}
  #videos{flex:1;overflow:auto}
  .vi{padding:5px 8px;border-bottom:1px solid #232a35;cursor:pointer;font-size:12.5px}
  .vi:hover{background:#242c38}
  .vi.on{background:#2b3d52}
  .vi .n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vi .s{font-size:11px;color:var(--dim)}
  .vi .bar{display:block;height:3px;border-radius:2px;background:#2a323e;margin-top:3px;overflow:hidden}
  .vi .bar i{display:block;height:100%;background:#4ea1ff}
  .vi .ops{display:none;gap:6px;margin-top:2px}
  .vi:hover .ops{display:flex}
  .vi .ops b{font-weight:400;font-size:11px;color:#8b93a1;padding:0 5px;border-radius:4px;cursor:pointer}
  .vi .ops b:hover{background:#33404f;color:#e6e9ef}
  .vi .ops .del:hover{color:var(--danger)}
  #stage{position:relative;flex:1;background:#000;display:flex;align-items:center;justify-content:center;min-width:0}
  #wrap{position:relative;height:100%;aspect-ratio:16/9;max-width:100%}
  #wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #draw{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;z-index:6}
  #drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--dim)}
  #drop b{font-size:16px;color:var(--fg)}
  #tlbox{border-top:1px solid var(--line);background:var(--panel);height:190px;position:relative}
  #tl{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
  #bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
  #seek{flex:1 1 auto;min-width:220px}
  #hint{position:absolute;left:0;right:0;bottom:0;padding:3px 10px;font-size:11px;color:var(--dim);background:#0f1218aa;pointer-events:none}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2b323d;border:1px solid var(--line);padding:6px 14px;border-radius:8px;font-size:12.5px;z-index:99}
  #txtbox{position:absolute;z-index:20;display:none}
  #txtbox textarea{background:#000c;color:#fff;border:1px dashed var(--accent);border-radius:6px;font:16px/1.4 system-ui;padding:4px 6px;resize:none;outline:none}
  #startup{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% 0%, #232a36 0%, #14171d 70%);z-index:200;display:flex;align-items:center;justify-content:center;padding:30px}
  #startup.hide{display:none}
  .su-card{width:min(820px,92vw);max-height:86vh;display:flex;flex-direction:column;gap:14px}
  .su-title{font-size:26px;font-weight:700;letter-spacing:.5px}
  .su-sub{color:var(--dim);font-size:13px;margin-top:-8px}
  .su-actions{display:flex;gap:10px;flex-wrap:wrap}
  .su-btn{padding:10px 18px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:#2b323d;color:var(--fg);cursor:pointer}
  .su-btn:hover{background:#37404e}
  .su-btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  .su-list{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#1c212a;min-height:120px}
  .su-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #262d38;cursor:pointer}
  .su-item:last-child{border-bottom:none}
  .su-item:hover{background:#26303c}
  .su-item .nm{font-size:14.5px}
  .su-item .path{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
  .su-item .meta{font-size:11.5px;color:var(--dim);text-align:right}
  .su-item .ren{color:#8b93a1;padding:2px 8px;border-radius:6px}
  .su-item .ren:hover{background:#33404f;color:#e6e9ef}
  .su-item .del{color:#7a6168;padding:2px 8px;border-radius:6px}
  .su-item .del:hover{color:var(--danger);background:#3a2b2f}
  .su-empty{padding:26px;text-align:center;color:var(--dim);font-size:13px}

</style>
</head>
<body>

<div id="top">
  <button id="projbtn">工程</button>
  <span id="pname">未建工程</span>
  <button id="impfiles">导入视频</button>
  <button id="impfolder">导入文件夹</button>
  <span class="tag">工具</span>
  <button data-tool="select" class="on">选择</button>
  <button data-tool="pen">画笔</button>
  <button data-tool="text">文字</button>
  <button data-tool="line">箭头</button>
  <button data-tool="rect">方框</button>
  <button data-tool="eraser">橡皮</button>
  <input type="color" id="color" value="#ff2d55" style="width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none">
  <input type="number" id="size" value="4" min="1" max="30" style="width:54px" title="笔粗">
  <span class="tag">橡皮</span>
  <input type="number" id="erasize" value="18" min="4" max="160" style="width:54px">
  <span style="flex:1"></span>
  <span class="tag" id="savehint"></span>
  <button id="undo">↶</button>
  <button id="redo">↷</button>
  <button id="exportclip">导出本段</button>
  <button id="export" style="background:#2f6d3f;border-color:#3d8a51">导出成片</button>
</div>

<div id="main">
  <div id="vlist">
    <div id="vsearch"><input id="vq" type="search" placeholder="搜视频名…"></div>
    <div id="vhead"><span id="vcount">视频</span><span style="flex:1"></span><span id="vclear" style="cursor:pointer">清空</span></div>
    <div id="videos"></div>
  </div>
  <div id="stage">
    <div id="wrap">
      <video id="vA" playsinline></video>
      <video id="vB" playsinline></video>
      <canvas id="draw"></canvas>
      <div id="txtbox"><textarea rows="1"></textarea></div>
    </div>
    <div id="drop"><b>拖视频或文件夹进来</b><span>也可以点上面的「导入视频 / 导入文件夹」</span></div>
  </div>
</div>

<div id="tlbox"><canvas id="tl"></canvas><div id="hint">上排片段：拖中间换顺序、拖两端裁剪、双击删除、C 切分｜注释轨：拖中间平移，拖两端改长短｜Shift+拖 或 中键拖 = 平移时间轴｜滚轮缩放</div></div>

<div id="bar">
  <button id="play">播放</button>
  <span class="tag" id="tc">帧 0 / 0</span>
  <input type="range" id="seek" min="0" max="0" value="0">
  <span class="tag">帧率</span><span id="fps">--</span>
  <button id="zoomout">－</button>
  <button id="zoomin">＋</button>
  <button id="fit">适配</button>
  <button id="cut">切分</button>
  <button id="delsel">删除</button>
  <button id="addtrack">＋ 注释轨</button>
  <button id="addclip">＋ 段落</button>
  <span class="tag" id="clipsum"></span>
  <span id="annbar" style="display:none;align-items:center;gap:6px">
    <span class="tag">起</span><input type="number" id="annin" style="width:70px">
    <span class="tag">止</span><input type="number" id="annout" style="width:70px">
    <button id="anndel" style="color:#ff5b6e">删这条</button>
  </span>
</div>

<div id="startup">
  <div class="su-card">
    <div class="su-title">InkCut</div>
    <div class="su-sub">选一个工程继续，或者新建一个</div>
    <div class="su-actions">
      <button class="su-btn primary" id="su-new">＋ 新建工程</button>
      <button class="su-btn" id="su-openfile">打开工程文件…</button>
    </div>
    <input id="su-search" type="text" placeholder="搜工程名或路径…"
      style="width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#242b35;color:var(--fg);font-size:13.5px">
    <div class="su-list" id="su-list"></div>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const V = [$('vA'), $('vB')];
const cv = $('draw'), ctx = cv.getContext('2d');
const tl = $('tl'), tctx = tl.getContext('2d');

const S = {
  file: '', fps: 60, total: 0, hasAudio: false,
  videos: [], vi: -1,
  proj: null,
  clips: [], tracks: [{ id: 1, name: '注释 1', color: '#4ea1ff', visible: true }], trackId: 2, curTrack: 1,
  anns: [], annId: 1,
  t: 0, playing: false, tool: 'select',
  selClip: -1, selAnn: null,
  zoom: 4, viewStart: 0,
  hist: [], histPos: -1,
  active: 0, drag: null, draft: null
};

function say(msg) {
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1500);
}
const toast = say;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clipLen = (c) => Math.max(1, c.out - c.in + 1);
const liveClips = () => S.clips.filter(c => !c.parked);
const timelineTotal = () => liveClips().reduce((n, c) => n + clipLen(c), 0);

function timelineToSource(t) {
  const live = liveClips();
  let off = 0;
  for (let i = 0; i < live.length; i++) {
    const c = live[i], L = clipLen(c);
    if (t < off + L || i === live.length - 1) {
      return { src: clamp(c.in + (t - off), c.in, c.out), clip: c, index: i, offset: off };
    }
    off += L;
  }
  return { src: 0, clip: null, index: -1, offset: 0 };
}

/* ---------- 历史 ---------- */
function snapshot() { return JSON.stringify({ clips: S.clips, anns: S.anns, tracks: S.tracks, curTrack: S.curTrack }); }
function pushHist() {
  const s = snapshot();
  if (S.hist[S.histPos] === s) return;
  S.hist = S.hist.slice(0, S.histPos + 1);
  S.hist.push(s);
  if (S.hist.length > 120) S.hist.shift();
  S.histPos = S.hist.length - 1;
  scheduleSave();
}
function restoreHist(i) {
  const d = JSON.parse(S.hist[i]);
  S.clips = d.clips; S.anns = d.anns; S.tracks = d.tracks; S.curTrack = d.curTrack;
  S.selClip = -1; S.selAnn = null;
  drawTimeline(); renderFrame(); syncSeek(); scheduleSave();
}
function undo() { if (S.histPos <= 0) return toast('没有可撤销的'); S.histPos--; restoreHist(S.histPos); }
function redo() { if (S.histPos >= S.hist.length - 1) return toast('没有可前进的'); S.histPos++; restoreHist(S.histPos); }

/* ---------- 存盘 ---------- */
let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}
async function saveNow() {
  if (!S.file) return;
  const data = { app: 'inkcut', version: 1, fps: S.fps, clips: S.clips, tracks: S.tracks, anns: S.anns, curTrack: S.curTrack };
  const r = await window.ink.notesSave(S.file, data);
  if (r && r.ok) $('savehint').textContent = '已存 · ' + new Date().toLocaleTimeString();
  if (S.proj) { S.proj.currentPath = S.file; window.ink.projectSave(S.proj, S.proj.file); }
  if (S.vi >= 0 && S.videos[S.vi]) S.videos[S.vi].hasNote = true;
  renderVideos();
}

/* ---------- 视频列表 ---------- */
function renderVideos() {
  const box = $('videos');
  const q = ($('vq').value || '').trim().toLowerCase();
  const list = S.videos.map((v, i) => ({ v, i })).filter(({ v }) => !q || ((v.rel || v.name) + ' ' + v.path).toLowerCase().includes(q));
  $('vcount').textContent = '视频 ' + (S.videos.length ? '(' + S.videos.length + ')' : '');
  if (!list.length) {
    box.innerHTML = '<div style="padding:12px 10px;color:var(--dim);font-size:12px">' + (S.videos.length ? '没有匹配' : '把视频或文件夹拖进来') + '</div>';
    return;
  }
  box.innerHTML = '';
  list.forEach(({ v, i }) => {
    const d = document.createElement('div');
    d.className = 'vi' + (i === S.vi ? ' on' : '');
    const label = (v.rel && v.rel !== v.name) ? v.rel : v.name;
    const pct = Math.round((v.cov || 0) * 100);
    d.innerHTML = '<span class="n" title="' + v.path + '">' + label.replace(/[<>&]/g, '') + '</span>'
      + '<span class="s">' + (v.hasNote ? '有注释' : '无注释') + (v.size ? ' · ' + Math.round(v.size / 1048576) + 'MB' : '') + '</span>'
      + '<span class="bar"><i style="width:' + pct + '%"></i></span>'
      + '<span class="ops"><b class="ren" title="重命名">改</b><b class="del" title="从列表移除">×</b></span>';
    d.querySelector('.ren').onclick = (ev) => { ev.stopPropagation(); renameVideo(i); };
    d.querySelector('.del').onclick = (ev) => { ev.stopPropagation(); removeVideo(i); };
    d.onclick = () => openFromList(i);
    box.appendChild(d);
  });
}

async function computeCoverage() {
  for (const v of S.videos) {
    try {
      const d = await window.ink.notesLoad(v.path);
      if (d && Array.isArray(d.clips) && d.fps) {
        const live = d.clips.filter(c => !c.parked);
        const used = live.reduce((n, c) => n + (c.out - c.in + 1), 0);
        const info = await window.ink.probe(v.path);
        const total = Math.max(1, Math.round(((info && info.duration) || 0) * ((info && info.fps) || d.fps)));
        v.cov = Math.min(1, used / total);
        v.hasNote = true;
      }
    } catch (e) {}
  }
  renderVideos();
}

function addVideos(items) {
  if (!items || !items.length) return;
  items.forEach(it => {
    const i = S.videos.findIndex(x => x.path === it.path);
    if (i >= 0) Object.assign(S.videos[i], it); else S.videos.push(it);
  });
  S.videos.sort((a, b) => (a.rel || a.name).localeCompare(b.rel || b.name, 'zh'));
  renderVideos();
  if (S.proj) { S.proj.videos = S.videos.map(v => v.path); window.ink.projectSave(S.proj, S.proj.file); }
}

async function renameVideo(i) {
  const v = S.videos[i];
  if (!v) return;
  const cur = v.name.replace(/\.[^.]+$/, '');
  const name = await askText('重命名视频', cur);
  if (!name || name === cur) return;
  alert('改名功能需要主进程支持，先记下来，下一版补上');
}

function removeVideo(i) {
  const v = S.videos[i];
  if (!v) return;
  if (!confirm('把「' + v.name + '」从列表移除？文件不会删')) return;
  S.videos.splice(i, 1);
  if (S.vi === i) { S.vi = -1; }
  else if (S.vi > i) S.vi--;
  renderVideos();
  if (S.proj) { S.proj.videos = S.videos.map(x => x.path); window.ink.projectSave(S.proj, S.proj.file); }
}

async function openFromList(i) {
  const v = S.videos[i];
  if (!v) return;
  await saveNow();
  S.vi = i;
  renderVideos();
  await loadVideo(v.path);
}

/* ---------- 打开视频 ---------- */
async function loadVideo(p) {
  S.file = p;
  const info = await window.ink.probe(p);
  S.fps = (info && info.fps) || 24;
  S.hasAudio = !!(info && info.hasAudio);
  S.total = Math.max(1, Math.round(((info && info.duration) || 0) * S.fps));
  $('fps').textContent = S.fps;

  const url = window.ink.mediaUrl(p);
  V.forEach(v => { v.src = url; v.load(); v.muted = true; });
  await new Promise((res) => {
    V[0].addEventListener('loadedmetadata', res, { once: true });
    V[0].addEventListener('error', res, { once: true });
    setTimeout(res, 4000);
  });

  let restored = null;
  try { restored = await window.ink.notesLoad(p); } catch (e) {}
  if (restored && Array.isArray(restored.clips) && restored.clips.length) {
    S.clips = restored.clips;
    S.tracks = Array.isArray(restored.tracks) && restored.tracks.length ? restored.tracks : [{ id: 1, name: '注释 1', color: '#4ea1ff', visible: true }];
    S.anns = Array.isArray(restored.anns) ? restored.anns : [];
    S.curTrack = restored.curTrack;
    if (!S.tracks.some(x => x.id === S.curTrack)) S.curTrack = S.tracks[0].id;
    S.trackId = Math.max(1, ...S.tracks.map(t => t.id)) + 1;
    S.annId = Math.max(0, ...S.anns.map(a => a.id || 0)) + 1;
  } else {
    S.clips = [{ in: 0, out: S.total - 1 }];
    S.tracks = [{ id: 1, name: '注释 1', color: '#4ea1ff', visible: true }];
    S.anns = []; S.curTrack = 1; S.trackId = 2; S.annId = 1;
  }
  S.t = 0; S.playing = false; S.active = 0;
  S.hist = []; S.histPos = -1; pushHist();
  $('drop').style.display = 'none';
  V[0].style.zIndex = '2'; V[0].style.opacity = '1';
  V[1].style.zIndex = '1'; V[1].style.opacity = '0';
  try { await V[0].play(); V[0].pause(); } catch (e) {}
  layoutCanvas();
  $('fit').click();
  seekTimeline(0); drawTimeline(); renderFrame(); syncSeek();
  $('savehint').textContent = '';
}

/* ---------- 播放 ---------- */
function setVideoTime(v, src) { try { v.currentTime = Math.max(0, src / S.fps); } catch (e) {} }

async function play() {
  if (!S.clips.length) return;
  if (S.t >= timelineTotal() - 1) S.t = 0;
  S.playing = true;
  $('play').textContent = '暂停';
  const m = timelineToSource(S.t);
  const cur = V[S.active], other = V[1 - S.active];
  cur.muted = false;
  cur.style.zIndex = '2'; cur.style.opacity = '1';
  other.style.zIndex = '1'; other.style.opacity = '0';
  setVideoTime(cur, m.src);
  try { await cur.play(); } catch (e) {}
  const live0 = liveClips();
  if (m.index + 1 < live0.length) setVideoTime(other, live0[m.index + 1].in);
  monitor();
}

function pause() {
  S.playing = false;
  $('play').textContent = '播放';
  V.forEach(v => v.pause());
  clearInterval(monTimer);
}
let monTimer = 0;

function monitor() {
  clearInterval(monTimer);
  monTimer = setInterval(() => {
    if (!S.playing) return;
    const m = timelineToSource(S.t);
    const cur = V[S.active];
    const srcNow = cur.currentTime * S.fps;
    const total = timelineTotal();
    S.t = clamp(m.offset + Math.floor(srcNow) - m.clip.in, 0, total - 1);
    renderFrame(); syncSeek(); drawTimeline();
    if (srcNow >= m.clip.out + 0.15) {
      const nextT = m.offset + clipLen(m.clip);
      if (nextT >= total) { S.t = total - 1; pause(); seekTimeline(S.t); return; }
      cutTo(nextT);
    }
  }, 8);
}

function cutTo(t) {
  const old = V[S.active], other = V[1 - S.active];
  const m = timelineToSource(t);
  const want = m.src / S.fps;
  if (Math.abs((other.currentTime || 0) - want) > 0.5 / S.fps) { try { other.currentTime = want; } catch (e) {} }
  other.muted = false;
  other.style.zIndex = '3'; other.style.opacity = '1';
  old.style.opacity = '0'; old.style.zIndex = '1';
  other.play().catch(() => {});
  old.pause(); old.muted = true;
  S.active = 1 - S.active;
  S.t = t;
  const live = liveClips();
  if (m.index + 1 < live.length) setVideoTime(V[1 - S.active], live[m.index + 1].in);
}

function seekTimeline(t) {
  S.t = clamp(t, 0, Math.max(0, timelineTotal() - 1));
  const m = timelineToSource(S.t);
  if (!S.playing) setVideoTime(V[S.active], m.src);
  renderFrame(); syncSeek(); drawTimeline();
}
function stepFrame(d) { if (S.playing) pause(); seekTimeline(S.t + d); }

function syncSeek() {
  const total = Math.max(1, timelineTotal());
  $('seek').max = Math.max(0, total - 1);
  $('seek').value = Math.min(S.t, total - 1);
  $('tc').textContent = '帧 ' + S.t + ' / ' + total;
  const parked = S.clips.filter(c => c.parked).length;
  $('clipsum').textContent = liveClips().length + ' 段 · ' + (total / (S.fps || 24)).toFixed(1) + ' 秒' + (parked ? ' · 备用 ' + parked : '');
}

function layoutCanvas() {
  const r = $('wrap').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(2, Math.round(r.width * dpr));
  cv.height = Math.max(2, Math.round(r.height * dpr));
}

/* ---------- 画面 ---------- */
function syncAnnBar() {
  const bar = $('annbar');
  if (!bar) return;
  if (!S.selAnn) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  $('annin').value = S.selAnn.start;
  $('annout').value = S.selAnn.end;
}

function renderFrame() {
  if (!S.file) return;
  const src = timelineToSource(S.t).src;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const W = cv.width, H = cv.height;
  // 洋葱皮：开了洋葱的轨道，画前后两帧的淡影
  const onionTracks = S.tracks.filter(tr => tr.onion);
  if (onionTracks.length) {
    const ids = onionTracks.map(x => x.id);
    for (let d = 2; d >= 1; d--) {
      const alpha = 0.30 - (d - 1) * 0.10;
      [src - d, src + d].forEach(f => {
        S.anns.filter(a => ids.includes(a.track) && f >= a.start && f <= a.end).forEach(a => {
          const g = ctx;
          g.save(); g.globalAlpha = alpha; paint(a, W, H); g.restore();
        });
      });
    }
  }
  S.anns.filter(a => {
    const tr = S.tracks.find(x => x.id === a.track) || S.tracks[0];
    return (!tr || tr.visible) && src >= a.start && src <= a.end;
  }).forEach(a => paint(a, W, H));
  if (S.draft) paint(S.draft, W, H);
  if (S.selAnn && src >= S.selAnn.start && src <= S.selAnn.end) {
    const b = bounds(S.selAnn);
    if (b) {
      ctx.save(); ctx.strokeStyle = '#4ea1ff'; ctx.setLineDash([6, 4]); ctx.lineWidth = 2;
      ctx.strokeRect(b.x * W, b.y * H, b.w * W, b.h * H); ctx.restore();
    }
  }
}

function paint(it, W, H) {
  if (!it) return;
  const g = ctx;
  g.save();
  g.strokeStyle = it.color || '#ff2d55';
  g.fillStyle = it.color || '#ff2d55';
  g.lineWidth = Math.max(1, (it.size || 4) * (W / 1280));
  g.lineCap = 'round'; g.lineJoin = 'round';
  const pts = it.points || [];
  const p = (q) => ({ x: q.x * W, y: q.y * H });
  if (it.tool === 'pen') {
    if (pts.length > 1) {
      g.beginPath(); g.moveTo(p(pts[0]).x, p(pts[0]).y);
      for (let i = 1; i < pts.length; i++) g.lineTo(p(pts[i]).x, p(pts[i]).y);
      g.stroke();
    }
  } else if (it.tool === 'line' || it.tool === 'rect') {
    if (pts.length >= 2) {
      const a = p(pts[0]), b = p(pts[pts.length - 1]);
      if (it.tool === 'line') {
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        const ang = Math.atan2(b.y - a.y, b.x - a.x), L = 16 * (W / 1280);
        g.beginPath();
        g.moveTo(b.x, b.y); g.lineTo(b.x - L * Math.cos(ang - 0.4), b.y - L * Math.sin(ang - 0.4));
        g.moveTo(b.x, b.y); g.lineTo(b.x - L * Math.cos(ang + 0.4), b.y - L * Math.sin(ang + 0.4));
        g.stroke();
      } else {
        g.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      }
    }
  } else if (it.tool === 'text') {
    const fs = Math.max(14, (it.size || 4) * 6) * (W / 1280);
    g.font = fs + 'px system-ui,"Microsoft YaHei"';
    g.textBaseline = 'top';
    const q = pts[0] || { x: 0.5, y: 0.5 };
    String(it.text || '').split('\n').forEach((line, i) => g.fillText(line, q.x * W, q.y * H + i * fs * 1.25));
  }
  g.restore();
}

function bounds(it) {
  const pts = it.points || [];
  if (!pts.length) return null;
  let x1 = 1, y1 = 1, x2 = 0, y2 = 0;
  pts.forEach(q => { x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x); y2 = Math.max(y2, q.y); });
  if (it.tool === 'text') {
    const lines = String(it.text || '').split('\n');
    const fsPx = Math.max(14, (it.size || 4) * 6);
    const h = (fsPx * 1.5 * lines.length) / (cv.height || 720);
    const w = Math.max(1, ...lines.map(s => s.length)) * (fsPx * 0.62) / (cv.width || 1280);
    x2 = Math.max(x2, x1 + w); y2 = Math.max(y2, y1 + h);
  }
  const pad = 6 / (cv.width || 1280);
  return { x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2 };
}
function hitIn(it, pt) {
  const b = bounds(it);
  if (!b) return false;
  return pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h;
}
function posOf(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}

/* ---------- 画布交互 ---------- */
cv.addEventListener('pointerdown', (e) => {
  if (!S.file) return;
  e.preventDefault();
  const p = posOf(e);
  const src = timelineToSource(S.t).src;

  if (S.tool === 'select') {
    const cur = S.anns.filter(a => src >= a.start && src <= a.end && ((S.tracks.find(x => x.id === a.track) || {}).visible));
    const hit = [...cur].reverse().find(a => hitIn(a, p));
    if (hit) {
      S.selAnn = hit;
      S.drag = { type: 'move-ann', ann: hit, from: p, orig: hit.points.map(q => ({ x: q.x, y: q.y })) };
      cv.setPointerCapture(e.pointerId);
    } else S.selAnn = null;
    renderFrame(); drawTimeline();
    return;
  }
  if (S.tool === 'eraser') {
    S.drag = { type: 'erase' };
    eraseAt(p, src);
    cv.setPointerCapture(e.pointerId);
    return;
  }
  if (S.tool === 'text') { startText(p, src); return; }

  if (!S.tracks.some(x => x.id === S.curTrack)) S.curTrack = S.tracks[0].id;
  S.draft = { id: S.annId++, track: S.curTrack, tool: S.tool, color: $('color').value, size: +$('size').value, points: [p], start: src, end: src, text: '' };
  cv.setPointerCapture(e.pointerId);
  renderFrame();
});

cv.addEventListener('pointermove', (e) => {
  if (!S.drag && !S.draft) return;
  const p = posOf(e);
  if (S.draft) {
    if (S.draft.tool === 'pen') S.draft.points.push(p); else S.draft.points[1] = p;
    renderFrame(); return;
  }
  if (S.drag.type === 'move-ann') {
    const dx = p.x - S.drag.from.x, dy = p.y - S.drag.from.y;
    S.drag.ann.points = S.drag.orig.map(q => ({ x: q.x + dx, y: q.y + dy }));
    renderFrame(); return;
  }
  if (S.drag.type === 'erase') eraseAt(p, timelineToSource(S.t).src);
});

cv.addEventListener('pointerup', () => {
  if (S.draft) {
    const d = S.draft;
    S.draft = null;
    if (d.tool === 'pen') {
      if (d.points.length === 1) d.points.push({ x: d.points[0].x + 0.002, y: d.points[0].y });
      if (d.points.length > 1) { S.anns.push(d); S.selAnn = d; pushHist(); }
    } else if (d.points.length >= 2) { S.anns.push(d); S.selAnn = d; pushHist(); }
    renderFrame(); drawTimeline();
  }
  if (S.drag) { S.drag = null; pushHist(); }
});

function eraseAt(p, src) {
  const r = (+$('erasize').value || 18) / (cv.width || 1280);
  let changed = false;
  S.anns = S.anns.filter(a => {
    if (src < a.start || src > a.end || a.tool !== 'pen') return true;
    const before = a.points.length;
    a.points = a.points.filter(q => Math.hypot(q.x - p.x, q.y - p.y) > r);
    if (a.points.length !== before) changed = true;
    return a.points.length > 1;
  });
  if (changed) renderFrame();
}

function startText(p, src) {
  const box = $('txtbox');
  const wr = $('wrap').getBoundingClientRect();
  box.style.display = 'block';
  box.style.left = (p.x * wr.width - 2) + 'px';
  box.style.top = (p.y * wr.height - 4) + 'px';
  const ta = box.querySelector('textarea');
  ta.value = ''; ta.style.width = '180px'; ta.style.height = '30px'; ta.focus();
  const done = () => {
    const text = ta.value.trim();
    box.style.display = 'none';
    ta.onblur = null; ta.onkeydown = null;
    if (!text) return;
    if (!S.tracks.some(x => x.id === S.curTrack)) S.curTrack = S.tracks[0].id;
    const a = { id: S.annId++, track: S.curTrack, tool: 'text', color: $('color').value, size: +$('size').value, points: [{ x: p.x, y: p.y }], start: src, end: src, text };
    S.anns.push(a); S.selAnn = a;
    pushHist(); renderFrame(); drawTimeline();
  };
  ta.onblur = done;
  ta.onkeydown = (ev) => {
    ev.stopPropagation();
    if (ev.key === 'Escape') { ta.value = ''; done(); }
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); done(); }
  };
}

/* ---------- 时间轴 ---------- */
const ROW = { ruler: 18, clips: 32, park: 24, track: 24 };

function drawTimeline() {
  syncAnnBar();
  const r = $('tlbox').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (tl.width !== w || tl.height !== h) { tl.width = w; tl.height = h; }
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, w, h);

  const ppf = S.zoom * dpr, pad = 8 * dpr;
  const xOf = (t) => pad + (t - S.viewStart) * ppf;

  tctx.fillStyle = '#161b23';
  tctx.fillRect(0, 0, w, ROW.ruler * dpr);
  const step = Math.max(1, Math.round(60 * dpr / ppf));
  tctx.fillStyle = '#5c6675';
  tctx.font = Math.round(10 * dpr) + 'px Consolas,monospace';
  for (let t = Math.floor(S.viewStart / step) * step; xOf(t) < w; t += step) {
    const x = xOf(t);
    if (x < 0) continue;
    tctx.fillRect(x, ROW.ruler * dpr - 4 * dpr, 1, 4 * dpr);
    tctx.fillText(String(t), x + 2 * dpr, 11 * dpr);
  }

  const cy = ROW.ruler * dpr + 4 * dpr, ch = ROW.clips * dpr;
  // 备用轨背景
  const py = cy + ch + 2 * dpr;
  tctx.fillStyle = '#151a22';
  tctx.fillRect(0, py, w, ROW.park * dpr);
  tctx.fillStyle = '#3d4655';
  tctx.font = Math.round(10 * dpr) + 'px system-ui';
  tctx.fillText('备用（不参与播放/导出）', 8 * dpr, py + 12 * dpr);

  let off = 0;
  S.clips.forEach((c, i) => {
    if (c.parked) return;
    const L = clipLen(c);
    const x1 = xOf(off), x2 = xOf(off + L);
    off += L;
    if (x2 < 0 || x1 > w) return;
    const sel = (S.selClip === i);
    tctx.fillStyle = sel ? '#2f6d9e' : '#2b4a63';
    tctx.fillRect(x1, cy, Math.max(2, x2 - x1), ch);
    tctx.strokeStyle = sel ? '#4ea1ff' : '#1d2b38';
    tctx.lineWidth = dpr;
    tctx.strokeRect(x1, cy, Math.max(2, x2 - x1), ch);
    tctx.save();
    tctx.beginPath(); tctx.rect(x1, cy, Math.max(2, x2 - x1), ch); tctx.clip();
    tctx.fillStyle = '#cfe2f5';
    tctx.font = Math.round(11 * dpr) + 'px system-ui';
    tctx.fillText('段落 ' + (i + 1) + '  ' + c.in + '–' + c.out, x1 + 5 * dpr, cy + 14 * dpr);
    tctx.restore();
  });

  // 备用轨上的片段
  let poff = 0;
  S.clips.forEach((c, i) => {
    if (!c.parked) return;
    const L = clipLen(c);
    const x1 = xOf(poff), x2 = xOf(poff + L);
    poff += L;
    if (x2 < 0 || x1 > w) return;
    const sel = (S.selClip === i);
    tctx.fillStyle = sel ? '#5b4a2f' : '#333a45';
    tctx.fillRect(x1, py + 4 * dpr, Math.max(2, x2 - x1), (ROW.park - 8) * dpr);
    tctx.strokeStyle = sel ? '#ffd166' : '#2a323e';
    tctx.lineWidth = dpr;
    tctx.strokeRect(x1, py + 4 * dpr, Math.max(2, x2 - x1), (ROW.park - 8) * dpr);
    tctx.save();
    tctx.beginPath(); tctx.rect(x1, py + 4 * dpr, Math.max(2, x2 - x1), (ROW.park - 8) * dpr); tctx.clip();
    tctx.fillStyle = '#9aa6b8';
    tctx.font = Math.round(10.5 * dpr) + 'px system-ui';
    tctx.fillText('备用 ' + c.in + '–' + c.out, x1 + 4 * dpr, py + 15 * dpr);
    tctx.restore();
  });

  S.tracks.forEach((tr, ti) => {
    const y = cy + ch + ROW.park * dpr + 4 * dpr + ti * ROW.track * dpr;
    const hh = ROW.track * dpr;
    tctx.fillStyle = tr.id === S.curTrack ? '#1f2836' : '#181e27';
    tctx.fillRect(0, y, w, hh);
    tctx.fillStyle = tr.color;
    tctx.fillRect(0, y, 3 * dpr, hh);
    tctx.fillStyle = tr.visible ? '#8b93a1' : '#4a5261';
    tctx.font = Math.round(10.5 * dpr) + 'px system-ui';
    tctx.fillText(tr.name, 122 * dpr, y + 14 * dpr);
    // 两个小按钮：显示/隐藏、洋葱皮
    const bw = 50 * dpr, bh = ROW.track * dpr - 8 * dpr;
    tctx.fillStyle = tr.visible ? '#2f3d4e' : '#232a35';
    tctx.fillRect(8 * dpr, y + 4 * dpr, bw, bh);
    tctx.fillStyle = tr.visible ? '#cfe2f5' : '#5c6675';
    tctx.font = Math.round(10 * dpr) + 'px system-ui';
    tctx.fillText(tr.visible ? '显示' : '隐藏', 16 * dpr, y + 15 * dpr);
    tctx.fillStyle = tr.onion ? 'rgba(78,161,255,.85)' : '#232a35';
    tctx.fillRect(62 * dpr, y + 4 * dpr, bw, bh);
    tctx.fillStyle = tr.onion ? '#06121f' : '#5c6675';
    tctx.fillText('洋葱', 68 * dpr, y + 15 * dpr);
    S._trkBtn = S._trkBtn || {};
    S._trkBtn[tr.id] = { y0: y, y1: y + ROW.track * dpr };

    let off2 = 0;
    S.clips.forEach(c => {
      const L = clipLen(c);
      S.anns.filter(a => a.track === tr.id).forEach(a => {
        const s = Math.max(a.start, c.in), e = Math.min(a.end, c.out);
        if (e < s) return;
        const x1 = xOf(off2 + (s - c.in)), x2 = xOf(off2 + (e - c.in) + 1);
        const selA = (S.selAnn === a);
        tctx.fillStyle = selA ? '#ffd166' : a.color;
        tctx.globalAlpha = selA ? 1 : 0.75;
        tctx.fillRect(x1, y + 4 * dpr, Math.max(3, x2 - x1), hh - 8 * dpr);
        tctx.globalAlpha = 1;
        if (selA) {
          const hw = 7 * dpr;                    // 把手宽度
          tctx.strokeStyle = '#fff';
          tctx.lineWidth = dpr;
          tctx.strokeRect(x1, y + 4 * dpr, Math.max(3, x2 - x1), hh - 8 * dpr);
          tctx.fillStyle = '#ffffff';
          tctx.fillRect(x1 - hw / 2, y + 3 * dpr, hw, hh - 6 * dpr);
          tctx.fillRect(x2 - hw / 2, y + 3 * dpr, hw, hh - 6 * dpr);
          tctx.fillStyle = '#4ea1ff';
          tctx.fillRect(x1 - 1 * dpr, y + 3 * dpr, 2 * dpr, hh - 6 * dpr);
          tctx.fillRect(x2 - 1 * dpr, y + 3 * dpr, 2 * dpr, hh - 6 * dpr);
        }
      });
      off2 += L;
    });
  });

  tctx.fillStyle = '#fff';
  tctx.fillRect(xOf(S.t), 0, 2 * dpr, h);
}

// 把 c 放到主轨「时间位置 t」对应的顺序上
function reorderLive(c, t) {
  const rest = S.clips.filter(x => x !== c);
  let off = 0, target = 0;
  for (const x of rest) {
    if (x.parked) continue;
    const L = clipLen(x);
    if (t > off + L / 2) target++;
    off += L;
  }
  const idx = rest.indexOf(c);
  if (idx >= 0) rest.splice(idx, 1);
  // 找到在整体数组里的插入点：放在第 target 个「在用」片段之前
  let seen = 0, insertAt = rest.length;
  for (let i = 0; i < rest.length; i++) {
    if (rest[i].parked) continue;
    if (seen === target) { insertAt = i; break; }
    seen++;
  }
  rest.splice(insertAt, 0, c);
  S.clips = rest;
  S.drag.index = S.clips.indexOf(c);
}

// 把备用片段在备用序列里换位置
function reorderParked(c, t) {
  const parked = S.clips.filter(x => x.parked && x !== c);
  let off = 0, target = 0;
  for (const x of parked) {
    const L = clipLen(x);
    if (t > off + L / 2) target++;
    off += L;
  }
  const rest = S.clips.filter(x => x !== c);
  let seen = 0, insertAt = rest.length;
  for (let i = 0; i < rest.length; i++) {
    if (!rest[i].parked) continue;
    if (seen === target) { insertAt = i; break; }
    seen++;
  }
  rest.splice(insertAt, 0, c);
  S.clips = rest;
  S.drag.index = S.clips.indexOf(c);
}

function tlPos(e) {
  const r = tl.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const x = (e.clientX - r.left) * dpr, y = (e.clientY - r.top) * dpr;
  const t = Math.round((x - 8 * dpr) / (S.zoom * dpr) + S.viewStart);
  return { x, y, t, dpr };
}

function tlHit(e) {
  const { x, y, t, dpr } = tlPos(e);
  const rulerH = ROW.ruler * dpr, cy = rulerH + 4 * dpr, ch = ROW.clips * dpr;
  if (y < rulerH) return { kind: 'ruler', t };
  if (y >= cy && y <= cy + ch) {
    let off = 0;
    for (let i = 0; i < S.clips.length; i++) {
      if (S.clips[i].parked) continue;
      const L = clipLen(S.clips[i]);
      if (t >= off && t < off + L) return { kind: 'clip', index: i, t, nearLeft: (t - off) <= 2, nearRight: (off + L - t) <= 2 };
      off += L;
    }
    return { kind: 'blank', t };
  }
  const parkTop = cy + ch + 2 * dpr;
  if (y >= parkTop && y <= parkTop + ROW.park * dpr) {
    let poff = 0;
    for (let i = 0; i < S.clips.length; i++) {
      if (!S.clips[i].parked) continue;
      const L = clipLen(S.clips[i]);
      if (t >= poff && t < poff + L) return { kind: 'park', index: i, t };
      poff += L;
    }
    return { kind: 'park-empty', t };
  }
  const ty = y - (cy + ch + 4 * dpr);
  if (ty >= 0) {
    const ti = Math.floor(ty / (ROW.track * dpr));
    const tr = S.tracks[ti];
    if (tr) {
      let off = 0, srcFrame = null;
      for (const c of S.clips) {
        const L = clipLen(c);
        if (t >= off && t < off + L) { srcFrame = c.in + (t - off); break; }
        off += L;
      }
      const hitA = srcFrame == null ? null : S.anns.find(a => a.track === tr.id && srcFrame >= a.start && srcFrame <= a.end);
      let near = null;
      if (hitA) {
        const tol = Math.max(1, Math.round(7 / Math.max(0.2, S.zoom)));
        if (srcFrame <= hitA.start + tol) near = 'in';
        else if (srcFrame >= hitA.end - tol) near = 'out';
      }
      return { kind: 'track', track: tr, index: ti, t, ann: hitA, near };
    }
  }
  return { kind: 'blank', t };
}

tl.addEventListener('pointerdown', (e) => {
  if (!S.file) return;
  // 中键 / Shift + 拖 = 平移时间轴
  if (e.button === 1 || e.shiftKey) {
    e.preventDefault();
    S.drag = { type: 'pan', x0: e.clientX, view0: S.viewStart };
    tl.style.cursor = 'grabbing';
    tl.setPointerCapture(e.pointerId);
    return;
  }
  const hit = tlHit(e);
  if (hit.kind === 'ruler' || hit.kind === 'blank') {
    if (S.playing) pause();
    seekTimeline(hit.t);
    S.drag = { type: 'scrub' };
    tl.setPointerCapture(e.pointerId);
    return;
  }
  if (hit.kind === 'clip') {
    S.selClip = hit.index; S.selAnn = null;
    if (hit.nearLeft || hit.nearRight) {
      S.drag = { type: 'trim', index: hit.index, side: hit.nearLeft ? 'in' : 'out' };
    } else {
      // 按住片段中间就能拖着换位置
      S.drag = { type: 'move-clip', index: hit.index };
      tl.style.cursor = 'grabbing';
    }
    tl.setPointerCapture(e.pointerId);
    drawTimeline();
    return;
  }
  if (hit.kind === 'park') {
    S.drag = { type: 'park-drag', index: hit.index };
    tl.setPointerCapture(e.pointerId);
    return;
  }
  if (hit.kind === 'park-empty') {
    // 从主轨拖下来放这里 = 变成备用
    S.drag = { type: 'park-empty' };
    tl.setPointerCapture(e.pointerId);
    return;
  }
  if (hit.kind === 'track' && x < 120 * dpr) {
    const tr = hit.track;
    if (x < 60 * dpr) { tr.visible = !tr.visible; }
    else { tr.onion = !tr.onion; }
    drawTimeline(); renderFrame(); return;
  }
  if (hit.kind === 'track') {
    S.curTrack = hit.track.id;
    if (hit.ann) {
      S.selAnn = hit.ann; S.selClip = -1;
      if (hit.near === 'in' || hit.near === 'out') {
        S.drag = { type: 'resize-ann', ann: hit.ann, side: hit.near };
      } else {
        S.drag = { type: 'move-ann-time', ann: hit.ann, startT: hit.t, origIn: hit.ann.start, origOut: hit.ann.end };
      }
    } else { S.selAnn = null; seekTimeline(hit.t); S.drag = { type: 'scrub' }; }
    tl.setPointerCapture(e.pointerId);
    drawTimeline();
  }
});

tl.addEventListener('pointermove', (e) => {
  if (!S.drag) {
    const h = tlHit(e);
    if (h.kind === 'clip') tl.style.cursor = (h.nearLeft || h.nearRight) ? 'ew-resize' : 'grab';
    else if (h.kind === 'track' && h.ann) tl.style.cursor = h.near ? 'ew-resize' : 'move';
    else tl.style.cursor = 'pointer';
    return;
  }
  const { t } = tlPos(e);
  if (S.drag.type === 'pan') {
    const dx = e.clientX - S.drag.x0;
    S.viewStart = Math.max(0, S.drag.view0 - dx / S.zoom);
    drawTimeline();
    return;
  }
  if (S.drag.type === 'scrub') { seekTimeline(t); return; }
  if (S.drag.type === 'park-drag') {
    const pos = tlPos(e);
    const dpr = pos.dpr;
    const mainBottom = (ROW.ruler + 4 + ROW.clips) * dpr;
    const c = S.clips[S.drag.index];
    if (!c) { S.drag = null; return; }

    if (pos.y < mainBottom) {
      // 拖回主轨：按位置插进去（有实时预览）
      if (c.parked) { c.parked = false; }
      reorderLive(c, pos.t);
      drawTimeline(); syncSeek(); renderFrame();
      return;
    }
    // 留在备用轨：在备用片段之间换顺序
    reorderParked(c, pos.t);
    drawTimeline();
    return;
  }
  if (S.drag.type === 'park-empty') return;
  if (S.drag.type === 'move-clip') {
    const pos = tlPos(e);
    const mainBottom = (ROW.ruler + 4 + ROW.clips) * pos.dpr;
    if (pos.y > mainBottom) {
      const c = S.clips[S.drag.index];
      if (c) {
        c.parked = true;
        // 放到备用序列末尾
        S.clips = S.clips.filter(x => x !== c);
        S.clips.push(c);
        S.drag = null;
        pushHist(); drawTimeline(); syncSeek(); renderFrame();
        toast('已移到备用轨');
      }
      return;
    }
  }
  if (S.drag.type === 'move-clip') {
    const cur = S.drag.index;
    let off = 0, target = 0;
    for (let i = 0; i < S.clips.length; i++) {
      if (i === cur) continue;
      const L = clipLen(S.clips[i]);
      if (t > off + L / 2) target++;
      off += L;
    }
    target = Math.max(0, Math.min(S.clips.length - 1, target));
    if (target !== cur) {
      const moved = S.clips.splice(cur, 1)[0];
      S.clips.splice(target, 0, moved);
      S.drag.index = target;
      S.selClip = target;
      drawTimeline(); syncSeek(); renderFrame();
    }
    return;
  }
  if (S.drag.type === 'trim') {
    const c = S.clips[S.drag.index];
    if (!c) return;
    const m = timelineToSource(t);
    if (S.drag.side === 'in') c.in = clamp(m.src, 0, c.out - 1);
    else c.out = clamp(m.src, c.in + 1, S.total - 1);
    drawTimeline(); syncSeek(); return;
  }
  if (S.drag.type === 'resize-ann') {
    const m = timelineToSource(t);
    const a = S.drag.ann;
    if (S.drag.side === 'in') a.start = Math.min(m.src, a.end);
    else a.end = Math.max(m.src, a.start);
    drawTimeline(); renderFrame();
    return;
  }
  if (S.drag.type === 'move-ann-time') {
    const dt = t - S.drag.startT, a = S.drag.ann;
    const len = S.drag.origOut - S.drag.origIn;
    a.start = clamp(S.drag.origIn + dt, 0, S.total - 1 - len);
    a.end = a.start + len;
    drawTimeline(); renderFrame();
  }
});

tl.addEventListener('pointerup', () => {
  if (S.drag && S.drag.type !== 'clip-select') pushHist();
  S.drag = null;
  tl.style.cursor = 'pointer';
  drawTimeline();
});

tl.addEventListener('dblclick', (e) => {
  const hit = tlHit(e);
  if (hit.kind === 'clip' && S.clips.length > 1) {
    S.clips.splice(hit.index, 1);
    S.selClip = -1;
    pushHist(); drawTimeline(); syncSeek();
    seekTimeline(Math.min(S.t, timelineTotal() - 1));
    toast('已删除这一段');
  }
});

/* ---------- 按钮 ---------- */
document.querySelectorAll('[data-tool]').forEach(b => { b.onclick = () => setTool(b.dataset.tool); });
function setTool(t) {
  S.tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  cv.style.cursor = t === 'select' ? 'default' : (t === 'text' ? 'text' : (t === 'eraser' ? 'cell' : 'crosshair'));
}

$('impfiles').onclick = async () => { addVideos(await window.ink.pickFiles()); };
$('impfolder').onclick = async () => {
  const r = await window.ink.pickFolder();
  if (!r || !r.files || !r.files.length) return toast('这个文件夹里没有视频');
  addVideos(r.files);
  toast('加入 ' + r.files.length + ' 个视频');
};
$('vq').oninput = renderVideos;
$('vclear').onclick = () => {
  if (!S.videos.length) return;
  if (!confirm('清空列表？文件不会删')) return;
  S.videos = []; S.vi = -1; renderVideos();
  if (S.proj) { S.proj.videos = []; window.ink.projectSave(S.proj, S.proj.file); }
};

$('play').onclick = () => { if (S.playing) pause(); else play(); };
$('undo').onclick = undo;
$('redo').onclick = redo;
$('zoomout').onclick = () => { S.zoom = Math.max(0.3, S.zoom / 1.4); drawTimeline(); };
$('zoomin').onclick = () => { S.zoom = Math.min(40, S.zoom * 1.4); drawTimeline(); };
$('fit').onclick = () => {
  const w = tl.getBoundingClientRect().width;
  S.zoom = Math.max(0.2, (w - 20) / Math.max(1, timelineTotal()));
  S.viewStart = 0;
  drawTimeline();
};
$('seek').oninput = (e) => { if (S.playing) pause(); seekTimeline(+e.target.value); };

// 时间轴上滚轮 = 以鼠标位置为中心缩放
$('tlbox').addEventListener('wheel', (e) => {
  if (!S.file) return;
  e.preventDefault();
  const box = $('tlbox').getBoundingClientRect();
  const x = e.clientX - box.left;                 // CSS 像素
  const before = S.viewStart + Math.max(0, x - 8) / S.zoom;
  const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
  S.zoom = Math.max(0.15, Math.min(60, S.zoom * factor));
  S.viewStart = Math.max(0, before - Math.max(0, x - 8) / S.zoom);
  drawTimeline();
}, { passive: false });

$('annin').onchange = () => {
  if (!S.selAnn) return;
  const v = Math.max(0, Math.min(S.total - 1, +$('annin').value || 0));
  S.selAnn.start = Math.min(v, S.selAnn.end);
  pushHist(); renderFrame(); drawTimeline();
};
$('annout').onchange = () => {
  if (!S.selAnn) return;
  const v = Math.max(0, Math.min(S.total - 1, +$('annout').value || 0));
  S.selAnn.end = Math.max(v, S.selAnn.start);
  pushHist(); renderFrame(); drawTimeline();
};
$('anndel').onclick = () => {
  if (!S.selAnn) return;
  S.anns = S.anns.filter(a => a !== S.selAnn);
  S.selAnn = null;
  pushHist(); renderFrame(); drawTimeline();
};

$('cut').onclick = () => {
  if (!S.clips.length) return;
  const m = timelineToSource(S.t);
  const c = m.clip;
  if (!c || m.src <= c.in || m.src >= c.out) return toast('播放头不在片段内部');
  const idx = S.clips.indexOf(c);
  const origOut = c.out;
  c.out = m.src - 1;
  S.clips.splice(idx + 1, 0, { in: m.src, out: origOut });
  pushHist(); drawTimeline(); syncSeek();
  toast('已切分');
};

$('delsel').onclick = () => {
  if (S.selAnn) {
    S.anns = S.anns.filter(a => a !== S.selAnn);
    S.selAnn = null; pushHist(); renderFrame(); drawTimeline(); return;
  }
  if (S.selClip >= 0 && S.clips.length > 1) {
    S.clips.splice(S.selClip, 1);
    S.selClip = -1; pushHist(); drawTimeline(); syncSeek();
    seekTimeline(Math.min(S.t, timelineTotal() - 1));
  }
};

$('addclip').onclick = () => {
  if (!S.file) return;
  const m = timelineToSource(S.t);
  const src = m.clip || { in: 0, out: S.total - 1 };
  S.clips.push({ in: src.in, out: src.out, parked: false });
  pushHist(); drawTimeline(); syncSeek();
  toast('已追加一段');
};

$('addtrack').onclick = () => {
  const id = S.trackId++;
  const colors = ['#4ea1ff', '#5ce08a', '#ffd166', '#ff8fab', '#c792ea'];
  S.tracks.push({ id, name: '注释 ' + S.tracks.length, color: colors[id % colors.length], visible: true });
  S.curTrack = id;
  pushHist(); drawTimeline();
};

$('exportclip').onclick = async () => {
  if (!S.file || !S.clips.length) return toast('先打开视频');
  let c = (S.selClip >= 0) ? S.clips[S.selClip] : null;
  if (!c || c.parked) {
    const m = timelineToSource(S.t);
    c = m.clip;
  }
  if (!c) return toast('没有可导出的片段');
  $('exportclip').textContent = '导出中…';
  const r = await window.ink.exportVideo({ file: S.file, fps: S.fps, clips: [{ in: c.in, out: c.out }], hasAudio: S.hasAudio });
  $('exportclip').textContent = '导出本段';
  if (r && r.ok) { toast('已导出这一段'); window.ink.reveal(r.path); }
  else if (r && !r.canceled) alert('导出失败：' + ((r && r.error) || '未知'));
};

$('export').onclick = async () => {
  if (!S.file || !S.clips.length) return toast('先打开视频');
  $('export').textContent = '导出中…';
  const liveClipsForExport = S.clips.filter(c => !c.parked);
  if (!liveClipsForExport.length) return toast('主轨上没有片段');
  const r = await window.ink.exportVideo({ file: S.file, fps: S.fps, clips: liveClipsForExport, hasAudio: S.hasAudio });
  $('export').textContent = '导出成片';
  if (r && r.ok) { toast('已导出'); window.ink.reveal(r.path); }
  else if (r && !r.canceled) alert('导出失败：' + ((r && r.error) || '未知'));
};

/* ---------- 工程 ---------- */
function setProjName() { $('pname').textContent = S.proj ? (S.proj.name || '未命名工程') : '未建工程'; }

async function showStartup() {
  $('startup').classList.remove('hide');
  const box = $('su-list');
  box.innerHTML = '<div class="su-empty">读取工程…</div>';
  let list = [];
  try { list = await window.ink.projectsList() || []; } catch (e) {}
  if (!list.length) {
    box.innerHTML = '<div class="su-empty">还没有工程。<br>点「＋ 新建工程」，或者直接把视频拖进来。</div>';
    return;
  }
  const q = ($('su-search') ? $('su-search').value : '').trim().toLowerCase();
  const shown = list.filter(p => !q || ((p.name || '') + ' ' + (p.file || '')).toLowerCase().includes(q));
  if (!shown.length) { box.innerHTML = '<div class="su-empty">没有匹配的工程</div>'; return; }
  box.innerHTML = '';
  shown.forEach(p => {
    const d = document.createElement('div');
    d.className = 'su-item';
    d.innerHTML = '<div style="flex:1;overflow:hidden">'
      + '<div class="nm">' + (p.name || '未命名') + '</div>'
      + '<div class="path">' + (p.file || '') + '</div></div>'
      + '<div class="meta">' + (p.count || 0) + ' 个视频</div>'
      + '<div class="ren" title="改工程名">改名</div>'
      + '<div class="del" title="从列表移除">✕</div>';
    d.querySelector('.del').onclick = async (ev) => {
      ev.stopPropagation();
      await window.ink.projectRemove(p.id);
      showStartup();
    };
    d.querySelector('.ren').onclick = async (ev) => {
      ev.stopPropagation();
      const name = await askText('工程名', p.name || '');
      if (!name) return;
      const proj = await window.ink.projectRead(p.file);
      if (!proj) return toast('读不到这个工程');
      proj.name = name;
      await window.ink.projectSave(proj, p.file);
      if (S.proj && S.proj.id === proj.id) { S.proj.name = name; setProjName(); }
      showStartup();
      toast('已改名');
    };
    d.onclick = async () => {
      const proj = await window.ink.projectRead(p.file);
      if (!proj) return toast('读不到这个工程');
      await openProject(proj);
      $('startup').classList.add('hide');
    };
    box.appendChild(d);
  });
}

async function openProject(proj) {
  S.proj = proj;
  setProjName();
  S.videos = [];
  const paths = Array.isArray(proj.videos) ? proj.videos : [];
  for (const p of paths) {
    const st = await window.ink.statPath(p);
    if (st && st.exists && !st.isDir) S.videos.push({ path: p, name: p.split(/[\\/]/).pop(), size: st.size, hasNote: true });
  }
  renderVideos();
  computeCoverage();
  const target = proj.currentPath ? S.videos.find(v => v.path === proj.currentPath) : null;
  if (target) openFromList(S.videos.indexOf(target));
  else if (S.videos.length) openFromList(0);
}

function askText(title, def) {
  return new Promise((resolve) => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:400;display:flex;align-items:center;justify-content:center';
    box.innerHTML = '<div style="background:#252a33;border:1px solid #343b47;border-radius:12px;width:460px;padding:18px 20px">'
      + '<div style="font-size:15px;font-weight:600;margin-bottom:10px">' + title + '</div>'
      + '<input id="at-inp" type="text" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #343b47;background:#2f3642;color:#e6e9ef;font-size:14px">'
      + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'
      + '<button id="at-cancel">取消</button><button id="at-ok" style="background:#4ea1ff;border-color:#4ea1ff;color:#06121f;font-weight:600">确定</button></div></div>';
    document.body.appendChild(box);
    const inp = box.querySelector('#at-inp');
    inp.value = def || '';
    setTimeout(() => { inp.focus(); inp.select(); }, 20);
    const done = (v) => { box.remove(); resolve(v); };
    box.querySelector('#at-ok').onclick = () => done(inp.value.trim());
    box.querySelector('#at-cancel').onclick = () => done(null);
    inp.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter') done(inp.value.trim()); if (e.key === 'Escape') done(null); };
  });
}

function showNewProjectDialog() {
  const d = new Date();
  const defName = '新工程 ' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  return new Promise(async (resolve) => {
    let dir = '';
    try { dir = (await window.ink.defaultProjectDir()) || ''; } catch (e) {}
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:400;display:flex;align-items:center;justify-content:center';
    box.innerHTML = '<div style="background:#252a33;border:1px solid #343b47;border-radius:12px;width:520px;padding:18px 20px">'
      + '<div style="font-size:16px;font-weight:600;margin-bottom:16px">新建工程</div>'
      + '<div style="font-size:12.5px;color:#8b93a1;margin-bottom:6px">工程名</div>'
      + '<input id="np-name" type="text" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #343b47;background:#2f3642;color:#e6e9ef;font-size:14px;margin-bottom:14px">'
      + '<div style="font-size:12.5px;color:#8b93a1;margin-bottom:6px">位置</div>'
      + '<div style="display:flex;gap:8px;margin-bottom:18px">'
      + '<input id="np-dir" type="text" readonly style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid #343b47;background:#2f3642;color:#c9d2e0;font-size:13px">'
      + '<button id="np-browse">浏览…</button></div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button id="np-cancel">取消</button>'
      + '<button id="np-ok" style="background:#4ea1ff;border-color:#4ea1ff;color:#06121f;font-weight:600">创建</button></div></div>';
    document.body.appendChild(box);
    const inpN = box.querySelector('#np-name');
    const inpD = box.querySelector('#np-dir');
    inpN.value = defName;
    inpD.value = dir;
    box.querySelector('#np-browse').onclick = async () => {
      const picked = await window.ink.pickDir('工程保存在哪');
      if (picked) inpD.value = picked;
    };
    const close = (v) => { box.remove(); resolve(v); };
    box.querySelector('#np-cancel').onclick = () => close(null);
    box.querySelector('#np-ok').onclick = () => {
      const name = (inpN.value || '').trim();
      const where = (inpD.value || '').trim();
      if (!name) return toast('给工程起个名字');
      if (!where) return toast('选一个保存位置');
      close({ name, dir: where });
    };
    inpN.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter') box.querySelector('#np-ok').click(); };
    setTimeout(() => { inpN.focus(); inpN.select(); }, 30);
  });
}

$('projbtn').onclick = () => showStartup();
$('su-new').onclick = async () => {
  const r = await showNewProjectDialog();
  if (!r) return;
  const file = r.dir.replace(/[\\/]+$/, '') + '\\' + r.name.replace(/[\\/:*?"<>|]/g, '_') + '.inkcut.json';
  const proj = { id: 'p' + Date.now(), name: r.name, file, videos: [], currentPath: '' };
  await window.ink.projectSave(proj, file);
  S.proj = proj;
  setProjName();
  S.videos = [];
  renderVideos();
  $('startup').classList.add('hide');
  toast('工程已建：' + file);
};
$('su-openfile').onclick = async () => {
  const proj = await window.ink.projectOpenFile();
  if (!proj) return;
  if (proj.error) return toast('打不开：' + proj.error);
  await openProject(proj);
  $('startup').classList.add('hide');
};
$('su-search').oninput = () => showStartup();

/* ---------- 拖放 ---------- */
window.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;
  const pathOf = (f) => (window.ink.pathForFile ? window.ink.pathForFile(f) : (f.path || ''));
  const firstPath = pathOf(files[0]);
  if (!firstPath) return toast('拿不到文件路径');
  const st = await window.ink.statPath(firstPath);
  if (st && st.isDir) {
    const list = await window.ink.listVideos(firstPath);
    if (!list.length) return toast('这个文件夹里没有视频');
    addVideos(list);
    toast('加入 ' + list.length + ' 个视频');
    return;
  }
  const items = files.map(f => {
    const fp = pathOf(f);
    return fp ? { path: fp, name: f.name, size: f.size, hasNote: false } : null;
  }).filter(Boolean);
  addVideos(items);
  const idx = S.videos.findIndex(v => v.path === items[0].path);
  if (idx >= 0) openFromList(idx);
});

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.code === 'Space') { e.preventDefault(); S.playing ? pause() : play(); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(1); return; }
  if (e.key === 'v' || e.key === 'V') return setTool('select');
  if (e.key === '1') return setTool('pen');
  if (e.key === '2') return setTool('text');
  if (e.key === '3') return setTool('line');
  if (e.key === '4') return setTool('rect');
  if (e.key === '5') return setTool('eraser');
  if (e.key === 'c' || e.key === 'C') return $('cut').click();
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); return; }
});

window.addEventListener('resize', () => { layoutCanvas(); drawTimeline(); renderFrame(); });

setTool('select');
drawTimeline();
setProjName();
renderVideos();
if (!location.search.includes('nostart')) showStartup();

(function autoOpen() {
  const qs = new URLSearchParams(location.search);
  const p = qs.get('open');
  const seekTo = +(qs.get('t') || 0);
  if (p) loadVideo(p).then(() => { if (seekTo) seekTimeline(seekTo); });
})();
</script>
